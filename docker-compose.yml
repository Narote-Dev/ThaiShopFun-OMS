# Local inbox HMAC is the `local` Spring profile (backend application-local.yml),
# not a password in this file. Do not copy that value into a shared environment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oms
      # Dev-only bootstrap superuser. Flyway uses this login to create roles.
      # It bypasses row-level security. Do not reuse these values outside local Docker.
      POSTGRES_USER: oms
      POSTGRES_PASSWORD: oms
      # Dev-only passwords for the roles created in docker/postgres/init.
      # The API's local login is oms_app / OMS_APP_PASSWORD. Flyway uses POSTGRES_USER.
      # Override in the shell if you want. oms_maint has no login and no password.
      OMS_MIGRATOR_PASSWORD: ${OMS_MIGRATOR_PASSWORD:-oms_migrator}
      OMS_APP_PASSWORD: ${OMS_APP_PASSWORD:-oms_app}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oms -d oms"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - oms-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  oms-pgdata:
