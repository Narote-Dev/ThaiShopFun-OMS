name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            mock-tsf/pom.xml
      - name: Package backend without mock-tsf
        run: |
          rm -rf ~/.m2/repository/com/thaishopfun/mock-tsf
          cd backend && ./mvnw -B -DskipTests package
      - name: Install mock-tsf from this commit
        working-directory: mock-tsf
        run: ./mvnw -B -DskipTests -Dspotless.skip=true install
      - name: Verify (tests, Spotless, mock acceptance)
        working-directory: backend
        run: ./mvnw -B -Pmock-acceptance verify

  chaos:
    name: Delivery chaos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            mock-tsf/pom.xml
      - name: Install mock-tsf from this commit
        working-directory: mock-tsf
        run: ./mvnw -B -DskipTests -Dspotless.skip=true install
      - name: Chaos suite (1,000 events each way)
        working-directory: backend
        run: ./mvnw -B -Pmock-acceptance,chaos test
      - name: Upload chaos report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          if-no-files-found: warn
          path: |
            backend/target/chaos-report.json
            backend/target/surefire-reports/

  mock-tsf:
    name: Mock TSF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: mock-tsf/pom.xml
      - name: Verify (tests and Spotless)
        working-directory: mock-tsf
        run: ./mvnw -B verify

  perf:
    name: Checkout reserve perf
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            mock-tsf/pom.xml
      - name: Start Postgres and mock TSF
        run: docker compose up -d postgres mock-tsf
      - name: Wait for dependencies
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U oms -d oms && break
            sleep 2
          done
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8090/actuator/health && exit 0
            sleep 3
          done
          exit 1
      - name: Package backend
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      - name: Start OMS (local profile)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: local
          OMS_INBOX_WORKER_ENABLED: "false"
          OMS_STOCK_EXPIRY_ENABLED: "false"
        run: |
          java -jar target/*.jar --server.port=8080 > target/perf-backend.log 2>&1 &
          echo $! > target/perf-backend.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/actuator/health && exit 0
            sleep 2
          done
          exit 1
      - name: Seed perf data
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/oms
          SPRING_FLYWAY_USER: oms
          SPRING_FLYWAY_PASSWORD: oms
        run: |
          ./mvnw -B -Pperf test-compile
          java -cp "target/test-classes:target/classes:$(./mvnw -q -Pperf dependency:build-classpath -Dmdep.outputFile=/tmp/cp && cat /tmp/cp)" \
            com.thaishopfun.oms.perf.CheckoutPerfSeeder
      - name: Mint perf token
        id: token
        run: |
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8090/tsf-idp/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data "grant_type=client_credentials&client_id=tsf&client_secret=dev-tsf-client-secret" \
            | jq -r .access_token)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Gatling checkout reserve
        working-directory: backend
        run: |
          ./mvnw -B -Pperf gatling:test \
            -Dperf.baseUrl=http://127.0.0.1:8080 \
            -Dperf.token="${{ steps.token.outputs.token }}"
      - name: Upload Gatling report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-checkout-reserve
          if-no-files-found: warn
          path: backend/target/gatling/**
      - name: Upload perf backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-backend-log
          if-no-files-found: ignore
          path: backend/target/perf-backend.log

  contracts:
    name: Contract examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: mock-tsf/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Lint OpenAPI
        working-directory: contracts
        run: npm ci && npm run lint
      - name: Validate examples against JSON Schema
        working-directory: mock-tsf
        run: ./mvnw -B -Dtest=ContractExamplesTest,EnvelopeSchemaTest test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, build, and test
        working-directory: frontend
        run: npm ci && npm run lint && npm run build && npm test

  frontend-e2e:
    name: Frontend e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            mock-tsf/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright SSO
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/target/e2e-backend.log
