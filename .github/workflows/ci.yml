name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            mock-tsf/pom.xml
      - name: Package backend without mock-tsf
        run: |
          rm -rf ~/.m2/repository/com/thaishopfun/mock-tsf
          cd backend && ./mvnw -B -DskipTests package
      - name: Install mock-tsf from this commit
        working-directory: mock-tsf
        run: ./mvnw -B -DskipTests -Dspotless.skip=true install
      - name: Verify (tests, Spotless, mock acceptance)
        working-directory: backend
        run: ./mvnw -B -Pmock-acceptance verify

  chaos:
    name: Delivery chaos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            mock-tsf/pom.xml
      - name: Install mock-tsf from this commit
        working-directory: mock-tsf
        run: ./mvnw -B -DskipTests -Dspotless.skip=true install
      - name: Chaos suite (1,000 events each way)
        working-directory: backend
        run: ./mvnw -B -Pmock-acceptance,chaos test
      - name: Upload chaos report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          if-no-files-found: warn
          path: |
            backend/target/chaos-report.json
            backend/target/surefire-reports/

  mock-tsf:
    name: Mock TSF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: mock-tsf/pom.xml
      - name: Verify (tests and Spotless)
        working-directory: mock-tsf
        run: ./mvnw -B verify

  perf:
    name: Checkout reserve perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compile Gatling simulation
        working-directory: backend
        run: ./mvnw -B -Pperf test-compile
      - name: Upload Gatling sources
        uses: actions/upload-artifact@v4
        with:
          name: gatling-checkout-reserve
          if-no-files-found: warn
          path: backend/target/test-classes/com/thaishopfun/oms/perf/

  contracts:
    name: Contract examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: mock-tsf/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Lint OpenAPI
        working-directory: contracts
        run: npm ci && npm run lint
      - name: Validate examples against JSON Schema
        working-directory: mock-tsf
        run: ./mvnw -B -Dtest=ContractExamplesTest,EnvelopeSchemaTest test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, build, and test
        working-directory: frontend
        run: npm ci && npm run lint && npm run build && npm test

  frontend-e2e:
    name: Frontend e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            mock-tsf/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright SSO
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/target/e2e-backend.log
