# Local defaults match docker-compose.yml. Railway overrides DATABASE_* (see README).
# The datasource user is the dev-only bootstrap superuser so Flyway can create roles.
# It bypasses RLS. oms_app is the runtime role and is not this login until T03.
spring:
  application:
    name: oms
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/oms}
    username: ${DATABASE_USERNAME:oms}
    password: ${DATABASE_PASSWORD:oms}
    hikari:
      # Wait for Postgres when `docker compose up -d` and the app start together.
      initialization-fail-timeout: 60000
  flyway:
    enabled: true
    clean-disabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
