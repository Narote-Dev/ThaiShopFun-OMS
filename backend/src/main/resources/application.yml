# Local defaults match docker-compose.yml. Railway overrides DATABASE_* (see README).
# Runtime connects as oms_app (NOBYPASSRLS). Dev-only password, not for any shared environment.
# Flyway keeps the bootstrap superuser (local user `oms`), which bypasses RLS.
spring:
  application:
    name: oms
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/oms}
    username: ${DATABASE_USERNAME:oms_app}
    password: ${DATABASE_PASSWORD:oms_app}
    hikari:
      # Wait for Postgres when `docker compose up -d` and the app start together.
      initialization-fail-timeout: 60000
  flyway:
    enabled: true
    clean-disabled: true
    # Change: separate login from the runtime pool. URL follows spring.datasource.url
    # unless FLYWAY_URL or a postgres:// DATABASE_URL sets it (see the post-processor).
    user: ${FLYWAY_USER:oms}
    password: ${FLYWAY_PASSWORD:oms}
  # Change: T07 CSV import (at most 20,000 rows). Lazy resolution lets the catalog error handler
  # answer an oversized upload in the section 4.8 error format.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      resolve-lazily: true

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-For so audit_log.ip is the client, not the proxy.
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# The local profile points the issuer and JWKS at mock-tsf. A blank jwks-uri still boots:
# API calls return 401 and GET /actuator/health stays open.
oms:
  security:
    issuer: ${OMS_JWT_ISSUER:http://localhost:9/tsf-idp}
    audience: ${OMS_JWT_AUDIENCE:oms}
    internal-audience: ${OMS_JWT_INTERNAL_AUDIENCE:oms-internal}
    jwks-uri: ${TSF_JWKS_URI:${OMS_JWKS_URI:}}
    # Client ids (azp or client_id) allowed to call /internal/**. Empty rejects every service token.
    internal-client-ids: []
    # Access-token typ. A blank entry allows a missing typ. local and test narrow this to at+jwt.
    # An id_token is rejected by audience (oms-web), not by this list.
    accepted-token-types:
      - at+jwt
      - JWT
      - ""
    # allow-rls-bypass stays at the Java default false. Do not set it here.
  inbox:
    # Comma-separated HMAC secrets, current key first. Empty outside local/test refuses to boot.
    # The dev value is application-local.yml (profile local), not this file.
    hmac-secrets: ${OMS_INBOX_HMAC_SECRETS:}
    # Polls claim_inbox_batch. Tests set this to false and call InboxWorker directly.
    worker-enabled: ${OMS_INBOX_WORKER_ENABLED:true}
    worker-delay-ms: ${OMS_INBOX_WORKER_DELAY_MS:1000}
    # 5 x handler-timeout (30s) stays inside the 5m lease.
    # lease is at most 1 hour (InboxLimits.MAX_LEASE), the claim_inbox_batch ceiling.
    batch-size: 5
    lease: 5m
    handler-timeout: 30s
    suspend-defer: 5m
    jitter-ratio: 0.2
    defer-delay: 30s
    max-defer: 24h
  order:
    unpaid-hold-grace: 10m
  order-intake:
    enabled: true
  # T10 recipient PII (AES-256-GCM key ring + HMAC key for phone_hash). No default in any
  # environment: the app refuses to boot without all three. keys = kid:base64-32-byte-key,
  # comma-separated; decrypt accepts any listed key, encrypt uses active-key-id.
  # The dev value is application-local.yml (profile local), not this file.
  pii:
    keys: ${OMS_PII_KEYS:}
    active-key-id: ${OMS_PII_ACTIVE_KEY_ID:}
    hash-key: ${OMS_PII_HASH_KEY:}
  # T14 outbox publisher. Blank URL or secret: the scheduler does not claim rows.
  # A set secret must be at least 32 bytes. The URL must be absolute http or https.
  # Lease must be at least 1s and longer than (batch-size + 1) * http-timeout.
  outbox:
    publisher-enabled: true
    poll-delay-ms: 2000
    batch-size: 20
    lease: 5m
    http-timeout: 10s
    jitter-ratio: 0.2
    destination-url: ${TSF_OMS_EVENTS_URL:}
    webhook-secret: ${OMS_OUTBOX_WEBHOOK_SECRET:}
  # T08 reservation engine. Retry is bounded (max 3). The expiry interval is capped at 60s so an
  # expired hold is back in stock within 2 minutes. Tests set expiry.enabled=false and call
  # StockExpiryJob directly.
  stock:
    checkout-ttl: 15m
    lock-timeout: 2s
    retry:
      max-retries: 3
      initial-backoff: 10ms
      multiplier: 4
      max-backoff: 160ms
    expiry:
      enabled: ${OMS_STOCK_EXPIRY_ENABLED:true}
      interval-ms: 60000
      batch-size: 200
      tenant-limit: 100
      max-batches-per-tenant: 50
