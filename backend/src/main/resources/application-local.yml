# Dev-only values for the local profile. Not production secrets.
# mock-tsf (docker compose) publishes the IdP and the webhook receiver on port 8090.
oms:
  security:
    issuer: http://localhost:8090/tsf-idp
    jwks-uri: http://localhost:8090/tsf-idp/.well-known/jwks.json
    internal-client-ids:
      - tsf
    # The mock mints typ=at+jwt. A real TSF may send JWT or no typ; that stays on the default list.
    accepted-token-types:
      - at+jwt
  inbox:
    hmac-secrets: dev-inbox-hmac-secret
  # DEV ONLY. Base64 of "dev-only-local-pii-key-NOT-PROD!" and "dev-only-local-pii-hmac-NOT-PROD".
  # Never reuse outside the local profile. Real keys come from OMS_PII_* env vars.
  pii:
    keys: dev1:ZGV2LW9ubHktbG9jYWwtcGlpLWtleS1OT1QtUFJPRCE=
    active-key-id: dev1
    hash-key: ZGV2LW9ubHktbG9jYWwtcGlpLWhtYWMtTk9ULVBST0Q=
  outbox:
    destination-url: http://localhost:8090/internal/v1/oms-events
    webhook-secret: dev-outbox-webhook-secret-local-only
